# Release pipeline (REL-01 turns this into a tagged release).
# Validate with: goreleaser check
version: 2

# Explícito a propósito: install.sh y su test derivan de aquí el nombre de los
# archivos de la release. Si goreleaser lo cambia por defecto, esto no se mueve.
project_name: hipoteca-cli

before:
  hooks:
    - go mod tidy
    - bash scripts/check.sh

builds:
  - id: hipoteca
    main: ./cmd/hipoteca
    binary: hipoteca
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# El tap y el bucket tienen que existir antes del primer release con token:
#   https://github.com/aam9063/homebrew-tap
#   https://github.com/aam9063/scoop-bucket
# El tap y el bucket ya existen y el release lleva un token de grano fino que
# sólo puede escribir en ellos: skip_upload va en false para que el tag publique
# la fórmula y el manifiesto junto a los binarios.
#
# goreleaser v2.19 marca `brews` como deprecado: la vía vigente para distribuir
# un binario es un Cask, no una Formula.
homebrew_casks:
  - name: hipoteca
    repository:
      owner: aam9063
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/aam9063/hipoteca-cli
    description: Euríbor, IRPH y cálculos de hipoteca desde la CLI, en JSON
    license: MIT
    binaries: [hipoteca]
    skip_upload: false

scoops:
  - name: hipoteca
    repository:
      owner: aam9063
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/aam9063/hipoteca-cli
    description: Euríbor, IRPH y cálculos de hipoteca desde la CLI, en JSON
    license: MIT
    skip_upload: false
