name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  # REF-06 (S8): el job que instala desde el manifiesto publicado se lanza a
  # mano, sin necesitar un tag nuevo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned to the patched toolchain declared in go.mod: go1.26.1 and older
          # carry stdlib vulnerabilities (crypto/x509, net/http) that HTTPS makes
          # reachable, and govulncheck is part of make check.
          go-version: '1.26.10'
          cache: true

      - name: Build
        run: make build

      - name: Check
        run: make check

  review-report:
    name: review gate report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require odd/reviews/<ID>.md when the PR title carries an ID
        run: bash scripts/check-review-report.sh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # REF-06 (S6/S7): verifica lo que el consumidor recibe, no lo que
  # producimos. Scoop instala el paquete del bucket publicado — descarga la
  # URL del manifiesto y comprueba su SHA256, así que una URL muerta o un
  # hash que no cuadre dejan el job en rojo — y el binario instalado responde
  # `version` con el contrato. Se lanza a mano (workflow_dispatch, S8): el
  # manifiesto apunta a la última release, no al código de este commit.
  release-check:
    name: release file and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # goreleaser no está instalado en la máquina de desarrollo, así que un
      # .goreleaser.yaml roto se descubriría el día del tag, que es el peor día.
      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check

      - name: install.sh syntax
        run: sh -n install.sh

      # Ejercita la detección de plataforma y la URL sin tocar la red.
      - name: install.sh --dry-run
        run: |
          set -eu
          fake=$(mktemp -d)
          printf '#!/bin/sh\ncase "$1" in -s) echo Linux ;; -m) echo x86_64 ;; esac\n' > "$fake/uname"
          chmod +x "$fake/uname"
          out=$(PATH="$fake:$PATH" HIPOTECA_VERSION=v0.1.0 sh install.sh --dry-run)
          echo "$out"
          echo "$out" | grep -q 'releases/download/v0.1.0/hipoteca-cli_0.1.0_linux_amd64.tar.gz'

      - name: install.sh rejects an unsupported system
        run: |
          set -eu
          fake=$(mktemp -d)
          printf '#!/bin/sh\ncase "$1" in -s) echo Plan9 ;; -m) echo x86_64 ;; esac\n' > "$fake/uname"
          chmod +x "$fake/uname"
          if PATH="$fake:$PATH" sh install.sh --dry-run >/dev/null 2>/tmp/err; then
            echo "un sistema no soportado no debe instalar nada"; exit 1
          fi
          grep -q Scoop /tmp/err
