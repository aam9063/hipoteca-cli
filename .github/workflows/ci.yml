name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned to the patched toolchain declared in go.mod: go1.26.1 and older
          # carry stdlib vulnerabilities (crypto/x509, net/http) that HTTPS makes
          # reachable, and govulncheck is part of make check.
          go-version: '1.26.10'
          cache: true

      - name: Build
        run: make build

      - name: Check
        run: make check

  review-report:
    name: review gate report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require odd/reviews/<ID>.md when the PR title carries an ID
        run: bash scripts/check-review-report.sh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
